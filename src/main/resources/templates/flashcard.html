<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Study Flashcards</title>
  <link rel="stylesheet" th:href="@{/css/flashcard.css}">
  <script th:src="@{/js/flashcard.js}" defer></script>
</head>
<body>
  <nav>
    <a th:href="@{/home}" id="homeLink">Home</a>
    <a th:href="@{/user}">Users</a>
    <a th:href="@{/classroom}">Classrooms</a>
    <a th:href="@{/category}">Study Sets</a>
    <a href="#" id="logoutLink">Logout</a>
  </nav>

  <div id="flashcardContainer">
    <div class="card" id="flashcard">
      <div class="card-inner">
        <div class="card-front">No Cards</div>
        <div class="card-back"></div>
      </div>
    </div>
    <br>
    <div class="flashcard-buttons">
      <button id="prev">Previous</button>
      <button id="delete">Delete</button>
      <button id="next">Next</button>
    </div>
  </div>

  <h3>Create A New Flashcard</h3>
  <input type="text" id="newSetTerm" placeholder="Set term">
  <input type="text" id="newSetDefinition" placeholder="Set definition">
  <button id="createFlashcardBtn">Create</button>
</body>
</html>
