<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Classrooms</title>
  <link rel="stylesheet" th:href="@{/css/classroom.css}">
  <script th:src="@{/js/classroom.js}" defer></script>
</head>
<body>
  <nav>
    <a th:href="@{/home}" id="homeLink">Home</a>
    <a th:hdesciref="@{/user}">Users</a>
    <a th:href="@{/classroom}">Classrooms</a>
    <a th:href="@{/category}">Study Sets</a>
    <a href="#" id="logoutLink" style="display:none">Logout</a>
  </nav>

  <h2>Your Classrooms</h2>
  <ul id="myClassrooms" class="classroom-list"></ul>

  <h3>Create a Classroom</h3>
  <input type="text" id="newClassroomName" placeholder="Classroom name">
  <button id="createClassroomBtn">Create</button>

  <h2>Search for New Classrooms</h2>
  <input type="text" id="classroomSearch" placeholder="Search for classrooms">
  
  <ul id="classroomList" class="classroom-list"></ul>
</body>
</html>
