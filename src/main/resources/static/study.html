<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Flashcards</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/study.js" defer></script>
  <style>
  #flashcardContainer {
    perspective: 1000px;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .card {
    width: 250px; /* smaller width */
    height: 150px; /* smaller height */
    position: relative;
    margin-bottom: 20px;
  }
  
  .card-inner {
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    position: relative;
  }
  
  .card:hover .card-inner {
    transform: rotateY(180deg);
  }
  
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }
  
  .card-front {
    background: #ffffff;
    color: #333;
  }
  
  .card-back {
    background: #00796b;
    color: white;
    transform: rotateY(180deg);
  }
  </style>
  
</head>
<body>
  <nav>
    <a href="index.html" id="homeLink">Home</a>
    <a href="users.html">Users</a>
    <a href="classrooms.html">Classrooms</a>
    <a href="sets.html">Study Sets</a>
    <a href="#" id="logoutLink" style="display:none">Logout</a>
  </nav>
  <div id="flashcardContainer">
    <div class="card" id="flashcard">
      <div class="card-inner">
        <div class="card-front">No Cards</div>
        <div class="card-back"></div>
      </div>
    </div>
    <br>
    <div class="flashcard-buttons">
      <button id="prev">Previous</button>
      <button id="delete">Delete</button>
      <button id="next">Next</button>
    </div>
  </div>

  <h3>Create A New Flashcard</h3>
  <input type="term" id="newSetTerm" placeholder="Set term">
  <input type="definiton" id="newSetDefinition" placeholder="Set definition">
  <button id="createFlashcardBtn">Create</button>
</body>
</html>
